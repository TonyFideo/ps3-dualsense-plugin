name: Build PS3 Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest

    steps:
    - uses: actions/checkout@v3

    - name: Build plugin
      run: |
        make

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ps3-dualsense-plugin
        path: |
          *.sprx
          *.prx
